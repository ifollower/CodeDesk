name: CodeDesk Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CODEDESK_SOURCE_URL: ${{ vars.CODEDESK_SOURCE_URL }}
  CODEDESK_ISSUES_URL: ${{ vars.CODEDESK_ISSUES_URL }}
  CODEDESK_WEBSITE_URL: ${{ vars.CODEDESK_WEBSITE_URL }}
  CODEDESK_DOWNLOAD_URL: ${{ vars.CODEDESK_DOWNLOAD_URL }}
  CODEDESK_PRIVACY_URL: ${{ vars.CODEDESK_PRIVACY_URL }}
  CODEDESK_DOCS_URL: ${{ vars.CODEDESK_DOCS_URL }}
  CODEDESK_DOCS_MOBILE_URL: ${{ vars.CODEDESK_DOCS_MOBILE_URL }}
  CODEDESK_DOCS_LINUX_PERMISSIONS_URL: ${{ vars.CODEDESK_DOCS_LINUX_PERMISSIONS_URL }}
  CODEDESK_DOCS_X11_URL: ${{ vars.CODEDESK_DOCS_X11_URL }}
  CODEDESK_DOCS_LINUX_LOGIN_URL: ${{ vars.CODEDESK_DOCS_LINUX_LOGIN_URL }}
  CODEDESK_DOCS_HEADLESS_URL: ${{ vars.CODEDESK_DOCS_HEADLESS_URL }}
  CODEDESK_DOCS_WHITELIST_URL: ${{ vars.CODEDESK_DOCS_WHITELIST_URL }}
  CODEDESK_API_URL: ${{ vars.CODEDESK_API_URL }}
  CODEDESK_UPDATE_API_URL: ${{ vars.CODEDESK_UPDATE_API_URL }}
  CODEDESK_RENDEZVOUS_SERVERS: ${{ vars.CODEDESK_RENDEZVOUS_SERVERS }}
  CODEDESK_RENDEZVOUS_PUBLIC_KEY: ${{ vars.CODEDESK_RENDEZVOUS_PUBLIC_KEY }}

jobs:
  validate:
    runs-on: [self-hosted, codedesk-linux]
    steps:
      - uses: actions/checkout@v6
      - name: Validate tag, versions, and public build configuration
        shell: bash
        run: make release-check VERSION="${GITHUB_REF_NAME#v}"

  linux:
    needs: validate
    runs-on: [self-hosted, codedesk-linux]
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      CODEDESK_ANDROID_CACHE_HOST: ${{ runner.tool_cache }}/codedesk/android
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Decode Android keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "codedesk-android.keystore"
          path.write_bytes(base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True))
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ANDROID_KEYSTORE_FILE={path}\n")
          PY
      - name: Export server images
        shell: bash
        run: make package-server-all VERSION="${GITHUB_REF_NAME#v}"
      - name: Build signed Android APK and AAB
        shell: bash
        run: |
          make docker-android-builder
          make package-android PROFILE=release FORMAT=all VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: codedesk-linux-${{ github.ref_name }}
          path: |
            target/packages/server/*
            target/packages/android/*
          if-no-files-found: error
      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/codedesk-android.keystore"

  apple:
    needs: validate
    runs-on: [self-hosted, codedesk-macos]
    env:
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
      APPLE_DEVELOPER_IDENTITY: ${{ vars.APPLE_DEVELOPER_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust release toolchain
        shell: bash
        run: rustup toolchain install 1.87.0 --profile minimal
      - name: Import temporary Apple signing material
        shell: bash
        run: bash scripts/ci/import_apple_signing.sh
      - name: Build signed and notarized Universal 2 DMG
        shell: bash
        run: make package-macos PROFILE=release VERSION="${GITHUB_REF_NAME#v}"
      - name: Build App Store IPA
        shell: bash
        run: make package-ios PROFILE=release DISTRIBUTION=app-store VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: codedesk-apple-${{ github.ref_name }}
          path: |
            target/packages/macos/*
            target/packages/ios/*
          if-no-files-found: error
      - name: Remove temporary Apple signing material
        if: always()
        shell: bash
        run: bash scripts/ci/cleanup_apple_signing.sh

  windows:
    needs: validate
    runs-on: [self-hosted, codedesk-windows]
    env:
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust release toolchain
        shell: powershell
        run: rustup toolchain install 1.87.0 --profile minimal
      - name: Decode Windows signing certificate
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "codedesk-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          "WINDOWS_SIGNING_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build signed Windows installer
        shell: powershell
        run: make package-windows PROFILE=release VERSION="$($env:GITHUB_REF_NAME.TrimStart('v'))"
      - uses: actions/upload-artifact@v4
        with:
          name: codedesk-windows-${{ github.ref_name }}
          path: target/packages/windows/*
          if-no-files-found: error
      - name: Remove Windows signing certificate
        if: always()
        shell: powershell
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\codedesk-signing.pfx"

  draft-release:
    needs: [linux, apple, windows]
    runs-on: [self-hosted, codedesk-linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codedesk-*-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-artifacts/*
          fail_on_unmatched_files: true
