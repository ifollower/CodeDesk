name: CodeDesk Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.4.9)"
        required: true
        type: string
      profile:
        description: "Build signed release packages or unsigned development packages"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - release
      build_ios:
        description: "Also build the signed iOS IPA"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  CODEDESK_RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
  CODEDESK_RELEASE_PROFILE: ${{ github.event_name == 'push' && 'release' || inputs.profile }}
  CODEDESK_BUILD_IOS: ${{ github.event_name == 'push' && 'true' || inputs.build_ios }}
  CODEDESK_SOURCE_URL: ${{ vars.CODEDESK_SOURCE_URL }}
  CODEDESK_ISSUES_URL: ${{ vars.CODEDESK_ISSUES_URL }}
  CODEDESK_WEBSITE_URL: ${{ vars.CODEDESK_WEBSITE_URL }}
  CODEDESK_DOWNLOAD_URL: ${{ vars.CODEDESK_DOWNLOAD_URL }}
  CODEDESK_PRIVACY_URL: ${{ vars.CODEDESK_PRIVACY_URL }}
  CODEDESK_DOCS_URL: ${{ vars.CODEDESK_DOCS_URL }}
  CODEDESK_DOCS_MOBILE_URL: ${{ vars.CODEDESK_DOCS_MOBILE_URL }}
  CODEDESK_DOCS_LINUX_PERMISSIONS_URL: ${{ vars.CODEDESK_DOCS_LINUX_PERMISSIONS_URL }}
  CODEDESK_DOCS_X11_URL: ${{ vars.CODEDESK_DOCS_X11_URL }}
  CODEDESK_DOCS_LINUX_LOGIN_URL: ${{ vars.CODEDESK_DOCS_LINUX_LOGIN_URL }}
  CODEDESK_DOCS_HEADLESS_URL: ${{ vars.CODEDESK_DOCS_HEADLESS_URL }}
  CODEDESK_DOCS_WHITELIST_URL: ${{ vars.CODEDESK_DOCS_WHITELIST_URL }}
  CODEDESK_API_URL: ${{ vars.CODEDESK_API_URL }}
  CODEDESK_UPDATE_API_URL: ${{ vars.CODEDESK_UPDATE_API_URL }}
  CODEDESK_RENDEZVOUS_SERVERS: ${{ vars.CODEDESK_RENDEZVOUS_SERVERS }}
  CODEDESK_RENDEZVOUS_PUBLIC_KEY: ${{ vars.CODEDESK_RENDEZVOUS_PUBLIC_KEY }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate tag, versions, and public build configuration
        shell: bash
        run: make release-check VERSION="${CODEDESK_RELEASE_VERSION#v}" RELEASE_CHECK_PROFILE="$CODEDESK_RELEASE_PROFILE"

  linux:
    needs: validate
    if: github.event_name == 'push'
    runs-on: [self-hosted, codedesk-linux]
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      CODEDESK_ANDROID_CACHE_HOST: ${{ github.workspace }}/target/docker-cache/android
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Decode Android keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "codedesk-android.keystore"
          path.write_bytes(base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True))
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ANDROID_KEYSTORE_FILE={path}\n")
          PY
      - name: Export server images
        shell: bash
        run: make package-server-all VERSION="${CODEDESK_RELEASE_VERSION#v}"
      - name: Build signed Android APK and AAB
        shell: bash
        run: |
          make docker-android-builder
          make package-android PROFILE=release FORMAT=all VERSION="${CODEDESK_RELEASE_VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: codedesk-linux-${{ env.CODEDESK_RELEASE_VERSION }}
          path: |
            target/packages/server/*
            target/packages/android/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove Android signing material
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/codedesk-android.keystore"

  apple:
    needs: validate
    runs-on: macos-26-intel
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.ci/vcpkg
      VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/.ci/vcpkg/installed
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.ci/vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.ci/vcpkg-cache,readwrite
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
      APPLE_DEVELOPER_IDENTITY: ${{ vars.APPLE_DEVELOPER_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Select pinned Xcode
        shell: bash
        run: |
          sudo xcode-select --switch "/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Install pinned Rust release toolchain
        shell: bash
        run: |
          rustup toolchain install 1.87.0 --profile minimal --component rustfmt
          rustup target add --toolchain 1.87.0 aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios
          rustup run 1.87.0 rustfmt --version
      - name: Install Apple native build tools
        shell: bash
        run: |
          brew install nasm
          nasm --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: apple-cargo-1.87.0-${{ hashFiles('Cargo.lock', 'flutter/pubspec.lock') }}
          restore-keys: apple-cargo-1.87.0-
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: apple-vcpkg-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'scripts/ci/prepare_vcpkg.py') }}
          restore-keys: apple-vcpkg-
      - name: Prepare pinned Apple native dependencies
        shell: bash
        run: |
          mkdir -p "$VCPKG_BINARY_CACHE"
          args=(--platform apple)
          if [[ "$CODEDESK_BUILD_IOS" == "true" ]]; then
            args+=(--with-ios)
          fi
          python3 scripts/ci/prepare_vcpkg.py "${args[@]}"
      - name: Import temporary Apple signing material
        if: env.CODEDESK_RELEASE_PROFILE == 'release' || env.CODEDESK_BUILD_IOS == 'true'
        shell: bash
        run: bash scripts/ci/import_apple_signing.sh
      - name: Build signed and notarized Universal 2 DMG
        shell: bash
        run: make package-macos PROFILE="$CODEDESK_RELEASE_PROFILE" VERSION="${CODEDESK_RELEASE_VERSION#v}"
      - name: Build App Store IPA
        if: env.CODEDESK_BUILD_IOS == 'true'
        shell: bash
        run: make package-ios PROFILE=release DISTRIBUTION=app-store VERSION="${CODEDESK_RELEASE_VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: codedesk-apple-${{ env.CODEDESK_RELEASE_VERSION }}
          path: |
            target/packages/macos/*
            target/packages/ios/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary Apple signing material
        if: always()
        shell: bash
        run: bash scripts/ci/cleanup_apple_signing.sh

  windows:
    needs: validate
    # Flutter 3.24 only maps Visual Studio 2019/2022 CMake generators. The
    # windows-2025 image now ships Visual Studio 2026, which Flutter mistakes
    # for Visual Studio 2019. Pin VS 2022 until the Flutter SDK is upgraded.
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.ci/vcpkg
      VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/.ci/vcpkg/installed
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/.ci/vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.ci/vcpkg-cache,readwrite
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Install pinned Rust release toolchain
        shell: powershell
        run: |
          rustup toolchain install 1.87.0 --profile minimal --component rustfmt
          rustup run 1.87.0 rustfmt --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/flutter_rust_bridge_codegen.exe
          key: windows-cargo-1.87.0-${{ hashFiles('Cargo.lock', 'flutter/pubspec.lock') }}
          restore-keys: windows-cargo-1.87.0-
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: windows-vcpkg-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'scripts/ci/prepare_vcpkg.py') }}
          restore-keys: windows-vcpkg-
      - name: Configure Windows build tools
        shell: powershell
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not (Test-Path "$llvm\libclang.dll")) { throw "libclang.dll was not found in $llvm" }
          if (-not $signtool) { throw "signtool.exe was not found" }
          "LIBCLANG_PATH=$llvm" | Out-File $env:GITHUB_ENV -Append
          "SIGNTOOL=$signtool" | Out-File $env:GITHUB_ENV -Append
          flutter config --enable-windows-desktop
      - name: Prepare pinned Windows native dependencies
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE | Out-Null
          python scripts/ci/prepare_vcpkg.py --platform windows
      - name: Decode Windows signing certificate
        if: env.CODEDESK_RELEASE_PROFILE == 'release'
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "codedesk-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          "WINDOWS_SIGNING_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build signed Windows installer
        shell: powershell
        run: |
          $version = $env:CODEDESK_RELEASE_VERSION.TrimStart("v")
          python scripts/release.py package windows --profile $env:CODEDESK_RELEASE_PROFILE --version $version
      - uses: actions/upload-artifact@v4
        with:
          name: codedesk-windows-${{ env.CODEDESK_RELEASE_VERSION }}
          path: target/packages/windows/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove Windows signing certificate
        if: always()
        shell: powershell
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\codedesk-signing.pfx"

  draft-release:
    needs: [linux, apple, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codedesk-*-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-artifacts/*
          fail_on_unmatched_files: true
