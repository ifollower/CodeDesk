networks:
  codedesk-net:
    external: false

services:
  hbbs:
    container_name: codedesk-hbbs
    ports:
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
      - 21118:21118
    image: codedesk-server:local
    build:
      context: ..
      dockerfile: server/docker-classic/Dockerfile
    command: hbbs -r codedesk.example.com:21117
    volumes:
      - ./data:/root
    networks:
      - codedesk-net
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: codedesk-hbbr
    ports:
      - 21117:21117
      - 21119:21119
    image: codedesk-server:local
    build:
      context: ..
      dockerfile: server/docker-classic/Dockerfile
    command: hbbr
    volumes:
      - ./data:/root
    networks:
      - codedesk-net
    restart: unless-stopped
